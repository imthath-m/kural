name: Kural

options:
  bundleIdPrefix: com.skydevz.kural
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  generateEmptyDirectories: true

packages:
  KuralDomain:
    path: Packages/KuralDomain
  KuralEngine:
    path: Packages/KuralEngine
  KuralStorage:
    path: Packages/KuralStorage
  KuralKit:
    path: Packages/KuralKit
  KuralMacOS:
    path: Packages/KuralMacOS
  KuralModels:
    path: Packages/KuralModels

targets:
  Kural-iOS:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: KuralKit
      - package: KuralModels
    settings:
      base:
        PRODUCT_NAME: Kural
        PRODUCT_BUNDLE_IDENTIFIER: com.skydevz.kural.ios
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Kural needs microphone access to transcribe your speech."
    scheme: {}

  Kural-macOS:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: KuralKit
      - package: KuralModels
      - package: KuralMacOS
    settings:
      base:
        PRODUCT_NAME: Kural
        PRODUCT_BUNDLE_IDENTIFIER: com.skydevz.kural.macos
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Kural needs microphone access to transcribe your speech."
    scheme: {}
